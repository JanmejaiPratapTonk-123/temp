<style>

        .popup-animate {
            animation: popupEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

<script>
        // Simple script to handle interaction feel (Subtle spring animation out)
        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.getElementById('close-btn');
            const secondaryCloseBtn = document.getElementById('secondary-close-btn');
            const card = document.querySelector('article');
            const backdrop = document.querySelector('.fixed.inset-0');
            const bgContext = document.getElementById('bg-context');

            function closePopup() {
                // Animate out
                card.style.transition = 'all 0.4s cubic-bezier(0.36, 0, 0.66, -0.56)'; // 'Spring' out
                card.style.transform = 'scale(0.9) translateY(30px)';
                card.style.opacity = '0';
                
                backdrop.style.opacity = '0';
                bgContext.style.filter = 'blur(0px)';
                bgContext.style.transform = 'scale(1)';
                
                // Hide after animation (simulated routing/closing)
                setTimeout(() => {
                    backdrop.style.display = 'none';
                }, 400);
            }

            closeBtn.addEventListener('click', closePopup);
            secondaryCloseBtn.addEventListener('click', closePopup);
        });
    </script>
